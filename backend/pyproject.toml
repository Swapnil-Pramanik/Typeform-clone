[project]
name = "typeform-clone-api"
version = "1.0.0"
description = "FastAPI backend for a Typeform clone: form authoring, publishing and public response collection."
# Upper bound is real: the libSQL driver used against Turso segfaults on
# import/connect under CPython 3.14. Vercel's Python runtime is 3.12.
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
# Needed whenever DATABASE_URL points at Turso — including when running the
# migration or the seed against production from a workstation.
libsql = ["sqlalchemy-libsql>=0.1.0"]

[tool.vercel]
entrypoint = "app/main.py"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
