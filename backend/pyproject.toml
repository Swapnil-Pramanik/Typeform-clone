[project]
name = "typeform-clone-api"
version = "1.0.0"
description = "FastAPI backend for a Typeform clone: form authoring, publishing and public response collection."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
libsql = ["sqlalchemy-libsql>=0.1.0"]

[tool.vercel]
entrypoint = "app/main.py"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
